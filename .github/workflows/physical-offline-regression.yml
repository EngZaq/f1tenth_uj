name: Physical F1TENTH offline regression

on:
  push:
    branches:
      - zaq/hardware-integration
  pull_request:
    paths:
      - 'src/f1tenth_bringup/**'
      - 'tools/exploration/**'
      - 'tools/diagnostics/**'
      - '.github/workflows/physical-offline-regression.yml'
  workflow_dispatch:

jobs:
  physical-python-offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout the requested commit
        uses: actions/checkout@v4
      - name: Configure Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install pure-Python test dependencies
        run: |
          python -m pip install 'numpy>=1.23,<2' 'PyYAML>=6,<7'
      - name: Compile hardware Python and launch scripts
        run: |
          python -m compileall -q src/f1tenth_bringup tools/exploration tools/diagnostics
      - name: Test physical mode mux gates (no ROS, no actuator)
        run: python src/f1tenth_bringup/scripts/physical_drive_mux.py --self-test
      - name: Test November 6 STOP snapshot
        run: python src/f1tenth_bringup/scripts/physical_stop_evidence.py
      - name: Test candidate planner and CPU deadline
        run: python tools/exploration/physical_candidate_planner.py
      - name: Test candidate planner against swept geometry
        run: python tools/diagnostics/test_physical_candidate_geometry.py
      - name: Test steering fit and radius math
        run: |
          python tools/diagnostics/fit_steering_measurements.py --self-test
          python tools/diagnostics/steering_radius_audit.py --radius 2.6
      - name: Check current read-only source calibration
        run: python tools/diagnostics/physical_calibration_precheck.py
