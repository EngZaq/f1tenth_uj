# F1TENTH UJ real car: single source of truth for real-car tests and shadow nodes.
# Read by tools/real_car_tests/params.py. Do not copy these numbers into scripts.
# Standard = docs/real_car/REAL_CAR_BASELINE_2026-11-14.md ("baseline 14 Nov").
# A value changes only with its test name and date (docs/real_car/REAL_CAR_TEST_RESULTS.md).
# null = not measured yet. PROVISIONAL = in use, but not verified on the car.

frames:
  map: map
  odom: odom
  base_link: base_link          # rear-axle centre (baseline 14 Nov, decision)
  laser: laser
  imu: imu_link

vehicle:
  wheelbase_m: 0.260            # CONFIRMED, baseline 14 Nov (replaces rough 0.25)
  wheel_diameter_m: 0.065       # CONFIRMED, baseline 14 Nov
  body_length_m: 0.345          # CONFIRMED, baseline 14 Nov
  body_width_m: 0.197           # CONFIRMED, baseline 14 Nov
  front_bumper_x_m: 0.305       # CONFIRMED, baseline 14 Nov (in base_link)

lidar:                          # base_link -> laser, CONFIRMED, baseline 14 Nov (replaces x 0.195)
  x_m: 0.215
  y_m: 0.0
  z_m: 0.150
  yaw_rad: 0.0
  fov_min_deg: -135.75          # MEASURED 22 Nov (T3 rehearsal 20261122_150925, 2598 still scans): no beam outside
  fov_max_deg: 134.25           #   this ever returned (driver scan_range 45..315 = 270 deg). Rear 134.5..-136 deg is
                                #   BLIND: T3 treats it as unknown (visibility not predicted, area checked by eye)
  self_mask:                    # [from_deg, to_deg, max_range_m] in the laser frame: returns inside are the car itself;
                                #   T3 clearance ignores them, T3 visibility counts those beams as unknown
    - [96.0, 114.0, 0.30]       # 22 Nov, still scan 20261122_150925 (lidar_self_mask.py output): left front, XT60
    - [116.0, 135.0, 0.30]      #   battery leads (Moatasem; to be tucked in, the mask stays as a backstop). Observed
                                #   max 0.167 / 0.139 m; edge returns up to 0.30 m in 151103. Range cap 0.30 m (approved).
                                #   114-116 deg: beams see past the leads (not masked)

imu:                            # base_link -> imu_link
  status: PROVISIONAL           # stream + sign CONFIRMED (baseline 14 Nov); how the TF was published on 14 Nov is unknown (asking Zaid)
  x_m: 0.091
  y_m: 0.057
  z_m: 0.046
  roll_rad: 3.141592653589793   # mounted upside down. 21 Nov (T4 bags): forward accel reads on IMU -x, so x points
                                # BACKWARD (pitch pi or roll pi + yaw pi, not roll pi), and the mount is tilted ~9-10 deg
                                # (still specific force 1.6-1.8 / -0.5 / -10.0 m/s^2). gz sign (base = -gz) unaffected.
                                # NOT changed: decide with Zaid; y sign needs a turn (T3). Results doc, Phase F.
  pitch_rad: 0.0
  yaw_rad: 0.0
  gyro_z_bias_dps: null         # T5. Bench value -0.067 deg/s was the ESP32 board, not the car (baseline C-6)
  gyro_z_scale: null            # T5. Bench value 1.009, ESP32 board (baseline C-6)
  gyro_z_noise_var_rad2_s2: null  # T5. Bench value 5.4e-7, ESP32 board (baseline C-6)

drivetrain:
  speed_to_erpm_gain: 8414.0    # Standard, baseline 14 Nov (1/(pi*0.065)*60*4.09*7 = 8412). Ground scale: T4
  # DECIDED 21 Nov (Moatasem): keep 8414. The T4 candidate ~8700 is WITHDRAWN: it came from a distance that
  # includes the start ramp, where the sensorless VESC reads ahead below ~2000 ERPM. Cruise-only (latency-free,
  # LiDAR range slope): carpet 8276-8311, tile 8444-8484 -> 8414 within 1.5 % on both floors. Results doc, Phase F.
  speed_to_erpm_offset: 0.0

steering:
  # Linear converter used by config/real_car/ackermann_to_vesc_real.yaml and vesc_to_odom_real.yaml.
  servo_gain: -0.50             # CONFIRMED 14 Nov after steering-play fix (baseline C-3)
  servo_offset: 0.335           # PROVISIONAL 21 Nov, tile T4 20261121_210557 (spot B -0.94 deg/m; results doc row
                                # "Steering centre 0.335"); session-to-session variation not yet tested; re-measure
                                # after the play fix. Was 0.330 (20 Nov), 0.320 (14 Nov), 0.361 before
  max_left_rad: 0.2994          # T2 19 Nov, servo 0.10 (left driving clip; stop ~0.08); R 0.84 m. Record; also the
  max_right_rad: -0.3208        # T2 19 Nov, servo 0.68 (right driving clip; stop ~0.70); R 0.78 m.  T3 full-lock
                                # expected angle (space check). T3 full lock measures the real ground values.
  # ASYMMETRY (decided 21 Nov, Moatasem): it is in SERVO units, not at the wheels. Wheels at the clips are nearly
  # symmetric (17.2 / 18.4 deg), but the servo travel to reach them is 0.235 left vs 0.345 right (horn off-centre +
  # linkage) -> per-side gains -0.874 left / -1.062 right (T2 fit; to be confirmed by T3 on the ground) with radian
  # limits 0.27 left / 0.325 right (= first angle that reaches each clip: 0.235/0.874 = 0.269, 0.345/1.062 = 0.325).
  # Permanent converter proposal: docs/real_car/PERMANENT_STOP_CONVERTER_PROPOSAL.md section 8. Test-only values:
  # t3 block. Re-mounting the horn: optional, only together with the play fix (then one T2 redo).
  backlash_servo: null          # T2 (play fixed 14 Nov; T2 confirms)
  # RECORD ONLY, not used: asymmetric trial adapter
  # (~/f1tenth_hw_evidence/steering_trial/steering_accel_adapter.py), measured BEFORE the 14 Nov play fix.
  # T2 decides whether a piecewise converter (our own node) is still needed.
  trial_record_pre_play_fix:
    center: 0.32
    left_gain: -0.44958461443514636
    right_gain: -0.8569600610009573
    left_limit_rad: 0.20
    right_limit_rad: 0.15

caps:
  mux_default_max_speed_mps: 0.35   # physical_drive_mux.py MAX_SPEED (unchanged default)
  mux_default_max_steer_rad: 0.10   # physical_drive_mux.py MAX_STEER (unchanged default)
  mux_ceiling_max_speed_mps: 1.5    # hard ceiling of the max_speed_mps mux parameter (Moatasem, 14 Nov)
  mux_ceiling_max_steer_rad: 0.40   # hard ceiling of the max_steer_rad mux parameter (Moatasem, 14 Nov)
  test_speed_steps_mps: [0.5, 1.0, 1.5]  # decision 14 Nov; raise one step only after the previous passed
  vesc_speed_max_margin: 1.10       # test yaml speed_max = step speed * gain * margin

dynamics:
  decel_mps2: null                  # T1/T4 (measured with the chosen stop method)
  decel_assumed_mps2: 1.0           # used until decel_mps2 is measured (Moatasem, 14 Nov)
  accel_measured_mps2: null         # T1/T4. Note: 12 Nov pulses needed 0.555 s to 0.24 m/s (~0.43 m/s^2)
  start_delay_s: null               # T4 (command -> motion)

runner:                             # tools/real_car_tests/run_test.py
  publish_hz: 50.0                  # mux JOY_TTL 0.20 s / COMMAND_TTL 0.22 s -> 10x margin
  ramp_accel_mps2: 0.5              # speed request ramp; the ground check uses this value.
                                    # 0.5 for T1 at 0.5 and 1.0 m/s (Moatasem, 14 Nov). The 1.5 m/s step
                                    # gets a ramp proposed from T1's measured accel/decel (0.5 needs ~5 m).
  deadman_first_press_s: 0.7        # SPACE before terminal auto-repeat starts
  deadman_repeat_s: 0.25            # SPACE gap allowed once auto-repeat runs
  status_ttl_s: 0.25                # /control/status older than this -> zero
  min_post_stop_zero_s: 1.0         # zero is sent at least this long after every stop
  arm_timeout_s: 1.5                # MANUAL_READY must arrive within this

t2:                                 # servo sweep rules (Moatasem, 14 Nov; two servos already burned)
  approved_servo_min: 0.10          # 19 Nov (was 0.22-0.455): Oct teleop clip 0.1-0.6 no binding +
  approved_servo_max: 0.60          # 18 Nov wheels free at 0.15/0.55 (REAL_CAR_TEST_RESULTS.md); = launch ceiling
  inside_step: 0.02                 # steps inside the approved range
  outside_step: 0.01                # beyond it: one step per confirmation, clip relaunch each time
  extend_step: 0.02                 # t2_servo_sweep.py --extend-right (19 Nov): right side past its last free point
  clip_margin: 0.005                # vesc_driver servo_min/max = last approved value -/+ this
  pulse_s: 0.8                      # first visit of a new outward point: at most this long (< 1 s incl. servo travel)
  max_hold_s: 120.0                 # any hold for measuring: back to centre after this
  slew_per_s: 0.25                  # servo command rate limit (servo units / s)

ground_check:                       # needed = v^2/(2*ramp) + steady + v^2/(2*decel) + margin + (bumper - lidar x)
  steady_length_m: 1.0
  margin_m: 0.5
  front_window_deg: 3.0             # median LiDAR range in +/- this window around 0 rad

t4:                                 # T4 straight line on the ground (run_test.py t4_straight), design 20 Nov
  mux_gate_m: 0.80                  # physical_drive_mux.py front_evidence stop_m (MANUAL): nearest finite < 0.80 m
  mux_sector_deg: 20.0              # ... in +/- this sector (from the laser). Runner: arm refused if nearest < gate + guard;
                                    # the brake trigger uses the front median only (20 Nov, narrow floor)
  gate_guard_m: 0.10                # runner brakes at >= gate + guard: the mux gate stays the backstop
  reaction_s: 0.20                  # scan age + runner 50 Hz + mux 20 Hz + converter 50 Hz + serial (worst case)
  max_approach_m: 3.0               # arm refused if the brake point is further than this (uncertain steering centre)
  time_slack_s: 1.0                 # hard time limit = expected time to the brake point + this
  wall_fit_deg: 10.0                # analyze.py: wall line fit in +/- this window (distance + heading to the wall)

t3:                                 # T3 constant-steering circles on the ground (run_test.py t3_circle), design 21 Nov
  steer_min_rad: 0.05               # --steer allowed: +0.05..+steer_max_left / -0.05..-steer_max_right rad (+ = left)
  steer_max_left_rad: 0.27          # per-side radian limits (21 Nov, asymmetry note in steering): the first angle that
  steer_max_right_rad: 0.325        #   reaches the servo clip 0.10 / 0.68. --full-lock commands exactly these (the
                                    #   converter clamp then sends the clip); a --steer run must stay below the clamp
  mux_cap_max_rad: 0.33             # launch max_steer_rad:=0.33 covers both limits (mux ceiling 0.40); arm refused above
  fallback_extra_m: 1.0             # VESC timeout NOT verified (no passed vesc_timeout_check): clear disk radius + this,
                                    #   and 0.5 m/s only after a counted 0.3 m/s run of the same command (+ spotter)
  servo_gain_left: -0.874           # T2 19 Nov per-side fit (fit.json left_gain), TEST-ONLY: T3 converter yaml only
  servo_gain_right: -1.062          # T2 19 Nov per-side fit (fit.json right_gain), TEST-ONLY
  target_turns: 2.0                 # stop (brake 5 A) once the gyro heading change reaches this many turns
  r_factor_min: 0.8                 # real radius assumed within [min, max] x L / tan(steer): nested circles,
  r_factor_max: 1.25                #   so one clear disk around the largest one covers all of them
  clear_margin_m: 0.30              # arm: no LiDAR return within (outer body reach + this) of the largest circle
  geofence_margin_m: 0.20           # drive: base_link (RF2O) must stay within R_max + this of the largest circle centre
  visibility_margin: 0.05           # arm: every heading's +/-20 deg window >= mux manual_min_front_valid + this
  turn_check_s: 2.0                 # drive: after this long, yaw rate must have the commanded sign and
  turn_check_fraction: 0.3          #   >= this share of v tan(steer) / L (else TURN_CHECK_FAILED)
  rf2o_stale_s: 0.3                 # drive: geofence source older than this -> stop
  time_slack_s: 3.0                 # hard time limit = ramp + target_turns x 2 pi x R_max / v + this

vesc_timeout_check:                 # vesc_timeout_check.py (stand, converter killed during 0.5 m/s), design 21 Nov
  timeout_ms_target: 300            # VESC Tool App Settings > General: timeout_msec. CONFIGURED 22 Nov (Moatasem; planned
                                    #   250); previous value unknown / default (24 Oct stand: release ~1 s). VERIFIED 22 Nov 20261122_150252:
                                    #   PASS onset 0.29 s, braked -2.44 A, < 300 ERPM in 0.33 s
  brake_current_target_a: 5.0       #   timeout_brake_current. CONFIGURED 22 Nov (was 0 A = release, coasting)
  onset_max_s: 0.40                 # PASS: drive current gone <= this after the converter's last message
                                    #   (300 ms + telemetry 20 ms + converter tick 20 ms = 0.34 s, + 60 ms margin)
  brake_current_min_a: 1.5          # PASS: current_motor reaches <= -this right after the onset. Stand T1b 14 Nov:
                                    #   brake 5 A -> -2.3..-3.7 A in the first 40 ms; release (current 0) -> 0.00 A
  converter_gap_min_s: 1.0          # VALID only if the converter really stopped (no status for >= this) while in DRIVE

t5:                                 # IMU noise (t5_imu_analyze.py), design 21 Nov
  static_min_s: 600.0               # T5a: static recording at least this long (15 min planned)
  block_s: 60.0                     # T5a drift: bias per block of this length
  settle_s: 2.0                     # T5b: steady window starts this long after the ramp ends
  still_s: 3.0                      # T5b: still reference = this long before the drive start (hands off >= 5 s)
  bench_gz_var_rad2_s2: 5.4e-7      # 11 Nov bench (ESP32 board, baseline C-6): comparison only

noise:                              # measurement R per sensor: T5/T6
  vesc_vx_var: null
  rf2o_vx_var: null
  gyro_vyaw_var: null
  time_offset_vesc_s: null
  time_offset_imu_s: null
