# Joystick-to-Ackermann for REAL commissioning through the physical drive mux.
# Deadman button 5 inherited from the working teleop configuration.
# Output is NOT /drive; only physical_drive_mux.py publishes /drive.
/**:
  ros__parameters:
    drive:
      type: topic
      interface_type: ackermann_msgs/msg/AckermannDriveStamped
      topic_name: /manual/drive
      deadman_buttons: [5]
      axis_mappings:
        drive-steering_angle:
          axis: 2
          scale: 0.10
          offset: 0.0
        drive-speed:
          axis: 1
          scale: 0.15
          offset: 0.0
