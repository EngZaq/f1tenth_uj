vesc_driver:
  ros__parameters:
    port: "/dev/ttyACM0"     # change to /dev/sensors/vesc once the udev rule exists
    brake_max: 200000.0
    brake_min: -20000.0
    current_max: 100.0
    current_min: 0.0
    duty_cycle_max: 0.0
    duty_cycle_min: 0.0
    position_max: 0.0
    position_min: 0.0
    servo_max: 0.67          # temporary, widen after the sweep
    servo_min: 0.1           # temporary, widen after the sweep
    speed_max: 10000.0       # ERPM, temporary low cap for first tests
    speed_min: -10000.0
