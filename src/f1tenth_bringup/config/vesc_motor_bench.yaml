# F1TENTH ROS driver command bounds for a secured, wheels-off-ground test.
# WARNING: These are ROS-side bounds only. NOT VESC firmware current limiting,
# failsafe, emergency stop, or permission for powered ground motion.
# Firmware minimum ERPM on this user's VESC was confirmed to be 900.
# Higher speed-driver cap permits a single supervised 1000 ERPM pulse.
# DO NOT use until actual VESC MOTOR and BATTERY current/regen limits
# have been reconfigured for a very low-power bench trial and READ BACK.
vesc_driver:
  ros__parameters:
    port: "/dev/serial/by-id/usb-STMicroelectronics_ChibiOS_RT_Virtual_COM_Port_304-if00"
    speed_min: -1100.0
    speed_max: 1100.0
    current_min: -2.0
    current_max: 2.0
    brake_min: 0.0
    brake_max: 0.0
    duty_cycle_min: 0.0
    duty_cycle_max: 0.0
    position_min: 0.0
    position_max: 0.0
    servo_min: 0.30
    servo_max: 0.42
